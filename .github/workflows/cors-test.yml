name: cors-test (temporary)
on: { push: { branches: [cors-test] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: npm i -s playwright@1.47.2 && npx -y playwright@1.47.2 install --with-deps chromium >/dev/null 2>&1
      - run: |
          for u in "scoreboard" "scoreboard?dates=20261104" "summary?event=401892647"; do echo "=== $u"; curl -sS -D - -o /dev/null -H "Origin: https://msasportas.github.io" "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/$u" | grep -i -E "^HTTP|access-control-allow-origin|cache-control"; done
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const pg = await b.newPage();
            pg.on('console', m => console.log('CONSOLE', m.text()));
            await pg.goto('https://msasportas.github.io/prop-check-nhl/manifest.webmanifest');
            const r = await pg.evaluate(async () => { const out = [];
              for (const [u, o] of [['scoreboard', {}], ['scoreboard?dates=20261104', {}], ['scoreboard', { cache: 'no-store' }], ['scoreboard?dates=20261104', { cache: 'no-store', credentials: 'omit' }], ['summary?event=401892647', { cache: 'no-store', credentials: 'omit' }], ['summary?event=401892647', {}]]) {
                try { const x = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/' + u, o); out.push('OK ' + x.status + ' ' + u + ' ' + JSON.stringify(o)); }
                catch (e) { out.push('FAIL ' + u + ' ' + JSON.stringify(o) + ' ' + e.message); } }
              return out; });
            console.log(r.join('\n')); await b.close(); })();
          JS
          node t.js
