name: cors-test (temporary)
on: { push: { branches: [cors-test] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare ESPN box columns with the NHL box, same moment
        run: |
          python3 - <<'PY'
          import json, urllib.request, unicodedata, re
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20) as r: return json.load(r)
          def key(n):
              n = unicodedata.normalize("NFKD", n).encode("ascii", "ignore").decode().lower()
              p = re.sub(r"[^a-z ]", "", n).split(); return (p[0][0] + " " + p[-1]) if p else n
          sb = get("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard")
          nhl = get("https://api-web.nhle.com/v1/score/now")
          print("ESPN abbrevs:", sorted({c["team"]["abbreviation"] for e in sb["events"] for c in e["competitions"][0]["competitors"]}))
          for e in sb["events"]:
              if e["status"]["type"]["state"] not in ("in", "post"): continue
              ab = {c["team"]["abbreviation"] for c in e["competitions"][0]["competitors"]}
              g = next((g for g in nhl["games"] if {g["awayTeam"]["abbrev"], g["homeTeam"]["abbrev"]} & ab), None)
              if not g: print("no NHL match", ab); continue
              es = get(f"https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event={e['id']}")
              nb = get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/boxscore")
              nsog = {}
              for side in ("awayTeam", "homeTeam"):
                  for grp in ("forwards", "defense"):
                      for p in nb["playerByGameStats"][side][grp]: nsog[key(p["name"]["default"])] = p.get("sog")
              agree = {"S": 0, "SOG": 0, "S+SM": 0}; n = 0; miss = []
              for t in es["boxscore"]["players"]:
                  for grp in t["statistics"]:
                      lab = grp.get("labels") or grp.get("keys")
                      if "S" not in lab: continue
                      for a in grp["athletes"]:
                          st = dict(zip(lab, a.get("stats", []))); k = key(a["athlete"]["displayName"])
                          if k not in nsog: miss.append(a["athlete"]["displayName"]); continue
                          n += 1; v = nsog[k]
                          agree["S"] += str(v) == st.get("S"); agree["SOG"] += str(v) == st.get("SOG")
                          try: agree["S+SM"] += v == int(st.get("S")) + int(st.get("SM"))
                          except Exception: pass
              print(e["shortName"], e["status"]["type"]["state"], "players matched", n, "agree", agree, "unmatched", miss[:5])
          PY
