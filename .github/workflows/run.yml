# The timer (see /TEAM.md "How the timer runs").
# GitHub's own schedule proved unreliable, so the timer is a CHAIN: each run loops scripts/cycle.sh for about
# 50 minutes (every 10 minutes from 8 AM to 3 AM Eastern, every 30 minutes otherwise), then its last step starts
# the next run with workflow_dispatch. The hourly schedule and code pushes only (re)start the chain.
# The concurrency group keeps one run going and at most one waiting; a newer waiting run replaces an older one,
# so chains merge and never multiply. Off switch: commit a file named config/stop_timer.
name: run
on:
  workflow_dispatch:
    inputs:
      chain_link:
        description: 'Which link of the chain this is (set by the previous run)'
        required: false
        default: '0'
      chain_started_at:
        description: 'When the chain began (set by the previous run)'
        required: false
        default: ''
  schedule:
    - cron: '17 * * * *'      # restarter only
  push:                       # a code or rule change starts a chain right away
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/**']
permissions:
  contents: write             # commit data/
  actions: write              # start the next run
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: scripts/guard_record.py --history walks every Record version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: loop (about 50 minutes)
        timeout-minutes: 60     # a step timeout still lets the hand-over step below run
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}    # the only place the keys exist; never echoed
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}   # optional; notifications only, never echoed
          PC_RUNNER_EVENT: ${{ github.event_name }}
          PC_RUNNER_RUN_ID: ${{ github.run_id }}
          PC_RUNNER_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_link || '0' }}
          PC_RUNNER_CHAIN_STARTED: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_started_at || '' }}
        run: bash scripts/loop.sh

      - name: start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PC_RUNNER_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_link || '0' }}
          PC_RUNNER_CHAIN_STARTED: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_started_at || '' }}
        # fallback: if the checkout itself failed there is no script, so ask GitHub directly (once)
        run: bash scripts/dispatch_next.sh || [ -f scripts/dispatch_next.sh ] || gh workflow run run.yml --ref "${GITHUB_REF_NAME:-main}"
