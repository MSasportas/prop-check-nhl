name: probe
on:
  push:
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: probe
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python scripts/probe.py
      - name: commit
        run: |
          git config user.name "prop-check-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status/probe.json
          git diff --cached --quiet || git commit -m "probe status"
          git pull --rebase -q && git push -q
