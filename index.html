<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Check">
<title>Prop Check NHL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b1118; --surface:#121b25; --raise:#18232f; --line:#22303f;
  --fg:#e7eef5; --muted:#8a9bad; --accent:#6cc4f0; --good:#6fcf97; --warn:#f0b95c; --bad:#f0897a;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;
  font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding:var(--sat) 16px calc(52px + var(--sab) + 24px)}
.d{font-family:var(--display);font-weight:600;letter-spacing:.01em}
.mu{color:var(--muted)}

/* header */
.hdr{display:flex;align-items:center;gap:8px;min-height:44px}
.hdr h1{font:600 22px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.ibtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-right:-10px;color:var(--muted)}
.tag-test{font-size:11px;line-height:16px;padding:0 8px;border-bottom:1px dashed var(--warn);color:var(--warn);text-align:center}

/* tappable full-width rows */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 0}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.statusline{font-size:12px;line-height:17px;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.statusline .lowpool{color:var(--warn);font-weight:500}
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .grow{font:600 18px/22px var(--display);letter-spacing:.01em}
.strip .pos{color:var(--good)} .strip .neg{color:var(--bad)}

/* banners */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:10px;border-radius:10px;border:1px solid var(--warn);
  background:rgba(240,185,92,.08);font-size:14px;line-height:20px}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-color:var(--bad);background:rgba(240,137,122,.08)} .banner.stop .ic{color:var(--bad)}
.banner.info{border-color:var(--line);background:var(--surface)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:500;color:var(--fg)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere}
.linkbtn{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.since{margin-top:10px;font-size:13px;color:var(--accent)}

/* sections */
.sec{margin-top:12px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.sec-h h2,.secbtn h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0}
.sec-sub{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.secbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px}
.secbtn h2{flex:1}
.secbtn .chev{transition:transform .15s}
.secbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.stack>*+*{margin-top:8px}

/* cards */
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:hidden}
.card[role=button]{cursor:pointer}
.card[aria-expanded="true"]{border-color:#35485c}
.r1{display:flex;align-items:baseline;gap:8px}
.rank{font:600 17px/22px var(--display);color:var(--accent);flex:none;min-width:12px}
.name{font:600 17px/22px var(--display);letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;flex:none}
.r2{display:flex;align-items:flex-start;gap:8px;margin-top:2px}
.bet{font:600 20px/24px var(--display);letter-spacing:.01em;flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.price{font:600 26px/26px var(--display);min-width:76px;text-align:right;flex:none;white-space:nowrap}
.stamp{font-size:11px;line-height:14px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.stamp .worse{color:var(--warn)} .stamp .better{color:var(--good)}
.chance{font-size:13px;line-height:18px;margin-top:4px}
.chance b{font-weight:500}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(108,196,240,.38)}
.bar i.over{background:var(--accent);border-radius:0 3px 3px 0}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px}
.reason{font-size:14px;line-height:20px;margin-top:6px;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;line-height:16px;
  background:var(--raise);border:1px solid var(--line);color:var(--fg);max-width:100%;white-space:nowrap}
.chip svg{flex:none}
.chip.ok{color:var(--good);border-color:rgba(111,207,151,.45)}
.chip.early{color:var(--warn);border-color:rgba(240,185,92,.45)}
.chip.lock{color:var(--muted)}
.chip.hollow{background:none;border-color:var(--muted);padding:0 9px}
.chip.new{background:var(--accent);border-color:var(--accent);color:#06202e;font-weight:500;padding:0 9px}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px}
.more>div+div{margin-top:6px}
.more .k{color:var(--muted)}
.hist{margin:2px 0 0;padding:0;list-style:none}
.hist li{display:flex;gap:8px}
.hist time{flex:none;min-width:62px;color:var(--muted)}
.note{font-size:12px;line-height:17px;color:var(--muted);margin-top:8px}
.result{display:flex;align-items:baseline;gap:2px;margin:-2px 0 4px;font-size:14px;line-height:20px}
.result .tg{font:600 18px/20px var(--display);letter-spacing:.03em}

/* pulled */
.pullbar{display:flex;gap:8px;align-items:flex-start;margin:-10px -12px 10px;padding:9px 12px;background:var(--raise);
  border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.pullbar .ic{flex:none;display:flex;color:var(--bad);margin-top:1px}
.pullbar b{font-weight:500;letter-spacing:.04em}
.pullbar .why{overflow-wrap:anywhere}
.dim{opacity:.6}
.dim .meta,.dim .note,.dim .stamp,.dim .mu{color:var(--fg)}
.strike{text-decoration:line-through;text-decoration-thickness:2px}
.lastprice{flex:none;text-align:right;font-size:12px;line-height:16px;white-space:nowrap;padding-top:5px}
.lastprice span{font:600 17px/20px var(--display)}

/* parlay */
.ptitle{font:600 17px/22px var(--display);letter-spacing:.01em}
.leg{padding:8px 0;border-bottom:1px solid var(--line)}
.leg .l1{display:flex;align-items:baseline;gap:8px}
.leg .lname{font:600 17px/22px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .lprice{font:600 20px/22px var(--display);flex:none}
.leg .l2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.leg .l2 .lb{color:var(--fg)}
.leg .l2 .lpulled{color:var(--fg);font-weight:500}
.psum{margin-top:8px;font-size:13px;line-height:19px}
.psum .about{font:600 20px/24px var(--display)}

/* goal watch + games */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.list .li{display:flex;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.list .li:last-child{border-bottom:0}
.list .li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.list .li .nm{font:600 16px/20px var(--display)}
.list .li .r{flex:none;white-space:nowrap;color:var(--muted)}
.list .li .r b{font:600 16px/20px var(--display);color:var(--fg)}
.list .sub{display:block;font-size:12px;color:var(--warn)}

/* empty + skeleton + error */
.empty .t{font-size:16px;line-height:23px;font-weight:500}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.skel{height:150px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
.skel.sm{height:20px;width:60%;border-radius:6px}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.secbtn .chev{transition:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;
  border:1px solid var(--accent);color:var(--accent);font-weight:500;font-size:14px}
.btn.wide{width:100%}

/* footer */
.foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs .in{max-width:520px;margin:0 auto;display:flex;height:52px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;color:var(--muted);
  font:600 18px/22px var(--display);letter-spacing:.03em;position:relative}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* record */
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.big .wl{font:600 44px/46px var(--display)}
.big .un{font:600 30px/34px var(--display)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.tbl{margin-top:16px;font-size:13px;line-height:18px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 40px 46px 50px;column-gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:11px;line-height:15px;color:var(--muted);padding:0 0 4px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .span2{grid-column:span 2}
.tr .few{grid-column:1 / -1;text-align:left;font-size:11px;line-height:15px;color:var(--muted);white-space:normal}
.tr .num{font:600 16px/18px var(--display)}
.tr .lbl small{display:block;font-size:11px;line-height:15px;color:var(--muted)}
.filters{display:flex;gap:2px;margin:14px -6px 0;flex-wrap:wrap}
.fbtn{min-height:44px;display:inline-flex;align-items:center;padding:0 6px}
.fbtn span{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.fbtn[aria-pressed="true"] span{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:500}
.night{margin-top:18px}
.night h3{font:600 17px/22px var(--display);letter-spacing:.02em;margin:0 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.night h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:44px;font:600 15px/20px var(--display);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:500}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ptag{display:inline-block;font:600 12px/16px var(--display);letter-spacing:.05em;padding:0 5px;margin-right:6px;border:1px solid var(--muted);border-radius:3px;color:var(--fg);vertical-align:1px}
.legs{padding:0 0 0 14px;border-left:2px solid var(--line);margin:0 0 4px 20px}
.legs .ent{min-height:0}

/* sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(3,7,11,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0}
.sheet-h .ibtn{margin:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + var(--sab));overscroll-behavior:contain}
.rules{margin:8px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere}
.rules li::marker{color:var(--muted);font-family:var(--display);font-weight:600}
.slot{font-weight:500;color:var(--accent);white-space:nowrap}
.slot.miss{color:var(--warn)}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.kv:last-child{border-bottom:0}
.kv .k{flex:none;width:108px;color:var(--muted);font-size:13px}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
.kv .v.bad{color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="hdr"><h1>Prop Check NHL</h1></div>
  <p class="mu" style="font-size:13px;margin:4px 0 14px">Loading tonight's picks</p>
  <div class="stack"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>
<nav id="tabs" class="tabs" aria-label="Views"></nav>
<div id="sheetroot"></div>
<noscript><p style="padding:16px">Prop Check NHL needs JavaScript turned on to show tonight's picks.</p></noscript>

<script>

function closeSheet(fromPop) {
  if (!S.sheet) return;
  if (!fromPop && history.state && history.state.sheet) { history.back(); return; }
  S.sheet = null; clear(sheetRoot); document.body.style.overflow = '';
  if (S.sheetFocus && document.contains(S.sheetFocus) && S.sheetFocus.focus) S.sheetFocus.focus();
}
function fillSheet() {
  var prevScroll = 0, old = sheetRoot.querySelector('.sheet-b'); if (old) prevScroll = old.scrollTop;
  clear(sheetRoot);
  var title = S.sheet === 'rules' ? 'How picks are made' : 'Update status';
  var body = h('div', { class: 'sheet-b' });
  if (S.sheet === 'rules') rulesBody(body); else statusBody(body);
  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'sheet-h' }, h('h2', { text: title }),
      h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close', on: { click: function () { closeSheet(false); } } }, icon('close', 22))), body);
  var scrim = h('div', { class: 'scrim', on: { click: function (e) { if (e.target === scrim) closeSheet(false); } } }, sheet);
  sheetRoot.appendChild(scrim); document.body.style.overflow = 'hidden'; body.scrollTop = prevScroll;
}
function slot(key, kind) {
  var v = ruleVal(key), n = num(v), t = null;
  if (kind === 'text') { if (v != null && v !== '') t = str(v); }
  else if (n != null) {
    if (kind === 'price') t = odds(n);
    else if (kind === 'pct') t = (Math.round(n * 1000) / 10) + '%';
    else if (kind === 'pts') t = String(Math.round(n * 1000) / 10);
    else t = String(n);
  }
  return t == null ? h('span', { class: 'slot miss', text: '[missing]' }) : h('span', { class: 'slot', text: t });
}
/* Sentences live here; every number comes from rules.json. "{key|kind}" kinds: price, pct, pts (0.02 -> 2), num, text. */
var RULES = [
  'Every pick needs a real Hard Rock price of {price_gate|price} or better, and no longer than {max_price|price}.',
  "Our chance blends our model ({model_weight|pct}) with Hard Rock's own price ({market_weight|pct}).",
  'Before blending, we take {uncertainty|pts} points off our model on every pick, {under_penalty|pts} more on unders, and {thin_over_penalty|pts} more on overs with a thin sample.',
  "We only pick when our chance is at least {min_p|pct} and beats the price's break-even by {margin_confirmed|pts} points ({margin_early|pts} when the lineup isn't confirmed).",
  'Thin sample means under {thin_rows|num} games of history, or under {thin_team_games|num} with his team. Under {min_history|num} games of history means no pick.',
  "If our model sits more than {news_gap|pts} points above what Hard Rock's price implies, we wait for the lineup. More than {too_good|pts} points and we pass, because the book likely knows something.",
  'No more than {max_per_player|num} per player and {max_per_game|num} per game on any night.',
  "Parlays are {parlay_min_legs|num} or {parlay_max_legs|num} legs, one leg per game, up to {parlay_cap|num} a night. Every leg needs our chance of at least {parlay_leg_min_p|pct} and a price from {parlay_leg_min_price|price} to {parlay_leg_max_price|price}. The combined chance must be at least {parlay_min_p_2|pct} for 2 legs or {parlay_min_p_3|pct} for 3, and beat the parlay's break-even by {parlay_edge|pts} points.",
  'A pick is pulled if the player is out of the lineup, the price goes past {price_gate|price} or past {max_price|price}, the line is gone, our chance falls to less than {pull_margin|pts} points over break-even, or the price moves {drift_pull|pts} points against us before the lineup is confirmed.',
  "Results come from the NHL boxscore once each game is final. Overtime counts, shootouts don't. Graded at the worst price shown, {stake|num} unit each.",
  'We need {min_sample|num} graded picks in a market before judging it. A market that is losing badly after {pause_legs|num} picks switches itself off, and no other rule changes before {change_legs|num}.'
];
function rulesBody(body) {
  var v = S.rules ? S.rules.version : null, up = S.rules ? S.rules.updated : null;
  var head = h('div', { class: 'mu', style: 'font-size:12px' });
  head.appendChild(node('Rules v')); head.appendChild(v != null ? node(str(v)) : h('span', { class: 'slot miss', text: '[missing]' }));
  head.appendChild(node(' · changed ')); head.appendChild(up ? node(fDateShort(up)) : h('span', { class: 'slot miss', text: '[missing]' }));
  body.appendChild(head);
  if (!S.rules) body.appendChild(h('p', { style: 'color:var(--warn)', text: "The rule numbers didn't load, so they show as [missing] below." }));
  var ol = h('ol', { class: 'rules' });
  RULES.forEach(function (s) {
    var li = h('li'), re = /\{([a-z0-9_]+)\|([a-z]+)\}/g, last = 0, m;
    while ((m = re.exec(s))) { if (m.index > last) li.appendChild(node(s.slice(last, m.index))); li.appendChild(slot(m[1], m[2])); last = re.lastIndex; }
    if (last < s.length) li.appendChild(node(s.slice(last)));
    ol.appendChild(li);
  });
  body.appendChild(ol);
  body.appendChild(h('p', { class: 'note', text: 'All times Eastern. Picks are estimates, not guarantees.' }));
}
function statusBody(body) {
  var sl = S.slate || {}, st = isObj(sl.status) ? sl.status : {}, exp = expired(), pool = isObj(st.pool) ? st.pool : {};
  var row = function (v, bad) { body.appendChild(h('div', { class: 'kv' }, h('span', { class: 'v' + (bad ? ' bad' : ''), text: v }))); };
  var pa = fStamp(st.prices_at), pt;
  switch (st.prices_state) {
    case 'ok': pt = pa ? 'Hard Rock prices read at ' + pa : 'Prices not read yet'; break;
    case 'not_yet': pt = 'Prices not read yet today'; break;
    case 'limited': pt = (pa ? 'Hard Rock prices read at ' + pa + '. ' : '') + 'Limited today: fewer games or markets than usual.'; break;
    case 'pool_empty': pt = 'No Hard Rock prices today. The odds pulls ran out.'; break;
    case 'feed_down': pt = 'No Hard Rock prices today. The odds feed did not answer.'; break;
    case 'keys_refused': pt = 'Hard Rock prices are off: the odds keys were refused. New keys are needed.' + (pa ? ' Last read ' + pa + '.' : ''); break;
    default: pt = (pa ? 'Hard Rock prices read at ' + pa : 'Prices not read yet') + (st.prices_state ? ' (' + str(st.prices_state) + ')' : '');
  }
  if (exp) pt = 'Prices not read yet today. Last read ' + (pa || 'not on file') + '.';
  row(pt, st.prices_state === 'pool_empty' || st.prices_state === 'feed_down' || st.prices_state === 'keys_refused');
  row(fStamp(st.next_price_read_at) ? 'Next price read ' + fStamp(st.next_price_read_at) : 'No further price read scheduled');
  var lt = lineupShort(st);
  if (st.lineups_state === 'failed') lt = "Lineups couldn't be checked, so picks stay Early.";
  else if (st.lineups_state === 'partial') lt = 'Lineups partly checked' + (fStamp(st.lineups_at) ? ' at ' + fStamp(st.lineups_at) : '') + '. Picks for teams not checked stay Early.';
  else if (fStamp(st.lineups_at)) lt = 'Lineups checked at ' + fStamp(st.lineups_at);
  row(lt, st.lineups_state === 'failed');
  if (st.lineups_note) row(str(st.lineups_note));
  if (fStamp(st.goalies_at)) row('Goalies checked at ' + fStamp(st.goalies_at));
  row((st.stats_state === 'behind' ? 'Stats are behind. ' : '') + (st.stats_through ? 'Stats through games of ' + fDateShort(st.stats_through) : 'Stats not built yet') +
    (fStamp(st.stats_built_at) ? ', built ' + fStamp(st.stats_built_at) : ''), st.stats_state === 'behind');
  if (num(st.lines_checked) != null) row('Checked ' + st.lines_checked + ' Hard Rock lines');
  var pl = [], od = oddsShort(st);
  if (od) pl.push((od.low ? 'Odds running low: ' : 'Odds: ') + od.days + ' at the current pace');
  var nk = Array.isArray(pool.keys) ? pool.keys.length : num(pool.keys);
  if (nk != null) pl.push(nk + (nk === 1 ? ' odds key' : ' odds keys') + ' in use');
  row(pl.length ? pl.join('. ') + '.' : 'Odds left: not reported', pool.low === true);
  row(fStamp(sl.generated_at) ? 'Last update ' + fStamp(sl.generated_at) : 'Last update time not on file', stale() || exp);
  var lr = isObj(st.last_run) ? st.last_run : null;
  if (lr && lr.ok === false) row('The last update failed' + (fStamp(lr.at) ? ' at ' + fStamp(lr.at) : '') + (lr.failed_step ? ' (' + str(lr.failed_step) + ')' : '') + '.', true);
  var ex = arr(st.excluded_teams).filter(isObj);
  if (ex.length) row('Not covered tonight: ' + ex.map(function (x) { return str(x.team) + (x.reason ? ' (' + str(x.reason) + ')' : ''); }).join(', '));
  if (S.fetchFail) row((S.fetchFail === 'file' ? "The picks file couldn't be read. Trying again." : "Can't reach the picks right now.") + ' Showing what loaded at ' + (fTime(S.loadedAt) || 'an earlier time') + '.', true);
  body.appendChild(h('p', { class: 'note', text: 'This page checks for updates about every ' + Math.round(uiVal('refresh_sec') / 60) + ' minutes while it is open. All times Eastern.' }));
}

/* ---------- wiring ---------- */
window.addEventListener('popstate', function () { if (S.sheet) closeSheet(true); route(); });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(false); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) writeSeen(); else load().then(schedule);
});
window.addEventListener('pagehide', writeSeen);
setInterval(function () { if (S.loaded && !document.hidden) maybeRender(); }, 30000);

S.view = viewFromHash();
renderTabs();
load().then(schedule);
})();
</script>
</body>
</html>
