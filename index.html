<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Prop Check">
<title>Prop Check NHL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="preload" as="font" type="font/woff2" href="fonts/barlow-condensed-600.woff2" crossorigin>
<style>
/* Prop Check NHL. A dense betting sheet: one accent (ice blue) for what you can tap, green/amber/red only for meaning,
   hairlines instead of shadows, condensed numerals for names and prices, system text for reading. Dark is the product. */
@font-face{font-family:"Barlow Condensed";src:url("fonts/barlow-condensed-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url("fonts/barlow-condensed-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0c0e11; --surface:#13161b; --raise:#1b1f26; --line:#242931; --line2:#363c46;
  --fg:#e9ebee; --fg2:#c2c7cf; --muted:#8b929d;
  --accent:#6cb8ff; --accent-soft:rgba(108,184,255,.13); --on-accent:#06131f;
  --good:#45d07c; --good-soft:rgba(69,208,124,.12);
  --warn:#f0b43c; --warn-soft:rgba(240,180,60,.11);
  --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.11);
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --w:clamp(52px,14.5vw,60px); --h:clamp(50px,7.2vh,58px);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px); --sal:env(safe-area-inset-left,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --surface:#ffffff; --raise:#eceef2; --line:#dde0e5; --line2:#c5cad2;
  --fg:#11151a; --fg2:#3a414b; --muted:#5d6571;
  --accent:#0a66c2; --accent-soft:rgba(10,102,194,.10); --on-accent:#ffffff;
  --good:#0e8040; --good-soft:rgba(14,128,64,.09);
  --warn:#935f00; --warn-soft:rgba(176,116,0,.10);
  --bad:#c42b2b; --bad-soft:rgba(196,43,43,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;
  font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mu{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
[hidden]{display:none!important}

/* page column: everything right of the rail */
.wrap{max-width:560px;margin:0 0 0 calc(var(--w) + var(--sal));padding:0 14px calc(28px + var(--sab));min-height:100vh}
@media (min-width:640px){.wrap{margin-left:calc(var(--w) + 24px)}}

/* header */
.hdr{position:sticky;top:0;z-index:6;display:flex;align-items:baseline;gap:10px;margin:0 -14px;padding:calc(var(--sat) + 14px) 14px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.hdr h1{font:700 22px/26px var(--cond);letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap}
.ibtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tag-test{margin:0 -14px;padding:calc(var(--sat) + 3px) 14px 3px;font-size:11px;line-height:16px;color:var(--warn);background:var(--warn-soft);border-bottom:1px solid var(--line)}
.tag-test+.hdr{padding-top:12px;top:0}

/* status + record strip: two tappable lines, like a ticker header */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.live{display:inline-block;width:7px;height:7px;margin-right:7px;vertical-align:1px;border-radius:50%;background:var(--good)}
.statusline{font-size:12.5px;line-height:17px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline .lowpool{color:var(--warn);font-weight:600}
.strip .grow{font:600 17px/22px var(--cond);letter-spacing:.01em}
.strip .rpart{white-space:nowrap}

/* banners: a 3px meaning bar on the left, plain text */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:12px;border-left:3px solid var(--warn);background:var(--warn-soft);font-size:13.5px;line-height:19px;border-radius:0 6px 6px 0}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-left-color:var(--bad);background:var(--bad-soft)} .banner.stop .ic{color:var(--bad)}
.banner.info{border-left-color:var(--accent);background:var(--accent-soft)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:650;color:var(--fg)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere;color:var(--fg2)}
.linkbtn{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.since{margin-top:12px;font-size:13px;line-height:18px;color:var(--accent);font-weight:600}

/* sections */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.sec-h h2,.secbtn h2{font:700 18px/22px var(--cond);letter-spacing:.01em;margin:0}
.secbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border-bottom:1px solid var(--line2)}
.secbtn h2{flex:1}
.secbtn .chev{transition:transform .15s}
.secbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.stack>*+*{border-top:1px solid var(--line)}

/* pick rows */
.card{display:block;width:100%;padding:14px 0 14px;position:relative}
.card[role=button]{cursor:pointer}
.card.pick[aria-expanded="true"]{background:linear-gradient(var(--surface),var(--surface)) 0 0/100% 100% no-repeat;box-shadow:-14px 0 0 var(--surface),14px 0 0 var(--surface)}
.card.empty{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sec>.card.empty{margin-top:10px}
.pk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:8px;align-items:start}
.pk.norank{grid-template-columns:minmax(0,1fr) auto}
.who{display:flex;gap:10px;align-items:flex-start;min-width:0}.who>div{min-width:0}
.hs{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--raise);border:1px solid var(--line);margin-top:2px}
.rank{font:600 17px/24px var(--cond);color:var(--muted)}
.name{display:block;font:700 21px/24px var(--cond);letter-spacing:.005em;overflow-wrap:anywhere}
.bet{font-size:15px;line-height:20px;font-weight:600;color:var(--fg);margin-top:1px;overflow-wrap:anywhere}
.meta{display:block;font-size:12.5px;line-height:18px;color:var(--muted);margin-top:2px}
.own{display:inline-block;font:700 12px/16px var(--cond);letter-spacing:.06em;color:var(--fg);padding:0 4px;border:1px solid var(--line2);border-radius:3px;vertical-align:1px}
.pcol{text-align:right;min-width:62px}
.price{display:block;font:700 28px/28px var(--cond);color:var(--fg);white-space:nowrap}
.price.noprice{font-size:17px;line-height:24px;color:var(--muted)}
.book{display:block;font-size:11px;line-height:14px;color:var(--muted);margin-top:3px;white-space:nowrap}
.stamp{font-size:11.5px;line-height:16px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.chance{font-size:13.5px;line-height:19px;margin-top:10px;color:var(--fg2)}
.chance b{font-weight:700;color:var(--fg)}
.reason .ag{color:var(--good);font-weight:600}
/* chance vs break-even: an edge meter. Centre tick = what the price needs, dot = our chance, green run = the edge */
.bar{position:relative;height:14px;margin-top:4px}
.bar::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line2);border-radius:1px}
.bar::after{content:"";position:absolute;left:0;right:0;top:4px;height:6px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.bar i{position:absolute;top:6px;height:2px;background:var(--good)}
.bar i.short{background:var(--bad)}
.bar u{position:absolute;top:1px;height:12px;width:2px;margin-left:-1px;background:var(--fg)}
.bar em{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--bg)}
.bar em.short{background:var(--bad)}
.reason{font-size:13.5px;line-height:19px;margin-top:6px;overflow-wrap:anywhere;color:var(--fg2)}
.clamp3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:12.5px;line-height:18px}
.tagx{display:inline-flex;align-items:center;gap:4px;color:var(--fg2);white-space:nowrap}
.tagx.ok{color:var(--good)}
.tagx.new{color:var(--accent);font-weight:700}
.tagx svg{flex:none}
/* settled track (segmented stepper, driven by the pick's real state): Early -> Lineup -> Locked */
.stp{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.stp .trk{display:inline-flex;align-items:center}
.stp .n{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);background:transparent}
.stp .c{width:12px;height:1.5px;background:var(--line2)}
.stp .n.on{border-color:currentColor;background:currentColor}
.stp .n.skip{border-style:dashed;border-color:currentColor}
.stp .c.on{background:currentColor}
.stp.early{color:var(--warn)} .stp.ok{color:var(--good)} .stp.lock{color:var(--muted)}
.stp .t{color:inherit;font-weight:600}
.stp.lock .t{color:var(--fg2)}
.chip.hollow{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;font-size:12px;color:var(--fg2)}
.more{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px;color:var(--fg2)}
.more>div+div{margin-top:6px}
.more b{color:var(--fg)}
.hist{margin:2px 0 0;padding:0;list-style:none}
.hist li{display:flex;gap:8px}
.hist time{flex:none;min-width:62px;color:var(--muted)}
.note{font-size:13px;line-height:18px;color:var(--muted);margin-top:12px}
.result{display:flex;align-items:baseline;gap:2px;margin:0 0 6px;font-size:13.5px;line-height:19px;color:var(--fg2)}
.result .tg{font:700 16px/20px var(--cond);letter-spacing:.03em}

/* tap to bet */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:6px;
  border:1px solid var(--line2);color:var(--fg);font:600 15px/20px var(--body)}
.btn.wide{width:100%}
.betrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.betrow .btn{flex:1 1 130px;min-width:0;padding:0 10px;text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.betrow .btn.hr{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.betrow .btn.alt{color:var(--fg)}

/* pulled */
.card.pulled{padding-left:12px;border-left:3px solid var(--bad);margin-top:10px;background:var(--bad-soft);border-radius:0 6px 6px 0;padding-right:10px}
.stack>.card.pulled{border-top:0}
.pullbar{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--fg2)}
.pullbar .ic{flex:none;display:flex;color:var(--bad);margin-top:1px}
.pullbar b{font:700 14px/18px var(--cond);letter-spacing:.06em;color:var(--bad)}
.pullbar .why{overflow-wrap:anywhere}
.ifbet{font-size:14px;line-height:20px;margin:6px 0 10px;overflow-wrap:anywhere;color:var(--fg);font-weight:600}
.dim{opacity:.7}
.strike{text-decoration:line-through;text-decoration-thickness:1.5px}
.lastprice{flex:none;text-align:right;font-size:11px;line-height:14px;white-space:nowrap;color:var(--muted)}
.lastprice span{display:block;font:700 20px/22px var(--cond);color:var(--fg2)}

/* games */
.list{border-top:0}
.list .li{display:flex;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.list .li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.list .gm{font-weight:650;color:var(--fg)}
.list .sub{display:block;font-size:12px;color:var(--warn)}
.list .li.done .gm,.list .li.done .gx{color:var(--muted)}
.list .gx{color:var(--fg2)}
.list .st{display:block;font-size:12px;line-height:17px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .st.dn{color:var(--good)}

/* empty + skeleton */
.empty .t{font-size:15px;line-height:21px;font-weight:650;color:var(--fg)}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.skel{height:118px;border-bottom:1px solid var(--line);background:linear-gradient(var(--raise),var(--raise)) 30px 18px/55% 16px no-repeat,linear-gradient(var(--raise),var(--raise)) 30px 46px/38% 12px no-repeat,linear-gradient(var(--raise),var(--raise)) right 0 top 18px/48px 24px no-repeat}
.skel.sm{height:20px;width:60%;border:0;background:var(--raise);border-radius:3px;margin-top:14px}
.loading{font-size:13px;margin:12px 0 4px}

/* footer */
.foot{margin-top:32px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* side rail dock: the page's navigation, pinned to the left edge */
.tabs{position:fixed;left:0;top:0;bottom:0;z-index:7;width:calc(var(--w) + var(--sal));padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 8px) var(--sal);
  background:var(--surface);border-right:1px solid var(--line)}
.rail{position:relative;display:flex;flex-direction:column;height:100%}
.rail .grp{position:relative;display:flex;flex-direction:column}
.rail .grp.end{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:var(--w);height:var(--h);color:var(--muted)}
.tab .ico{display:flex;align-items:center;justify-content:center;width:36px;height:30px;border-radius:7px;transition:background-color .2s,color .2s}
.tab .cap{font:600 11px/12px var(--cond);letter-spacing:.03em;color:var(--accent);display:none;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ico{background:var(--accent-soft)}
.tab[aria-current="page"] .cap{display:block}
.tab .lbl{position:absolute;left:calc(100% + 6px);top:50%;z-index:2;padding:5px 10px;border-radius:5px;background:var(--raise);border:1px solid var(--line2);
  color:var(--fg);font:600 13px/18px var(--body);white-space:nowrap;pointer-events:none;
  opacity:0;transform:translate(-8px,-50%);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.tab:hover .lbl{opacity:1;transform:translate(0,-50%)} .tab:hover{color:var(--fg)} .tab[aria-current="page"]:hover{color:var(--accent)}}
.tab:focus-visible{outline:none}
.tab:focus-visible .ico{outline:2px solid var(--accent);outline-offset:1px}
.tab:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
.tab .dot{position:absolute;top:calc(50% - 15px);right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tab .dot.ok{background:var(--good)} .tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--bad)}
.rail .ind{position:absolute;left:0;top:0;width:3px;height:var(--h);border-radius:0 2px 2px 0;background:var(--accent);opacity:0;pointer-events:none}
.rail .ind.on{opacity:1}
.rail.ready .ind{transition:transform .28s cubic-bezier(.3,.7,.2,1),height .28s}
@media (prefers-reduced-motion:reduce){
  .rail.ready .ind,.tab .lbl,.tab .ico,.secbtn .chev{transition:none}
}

/* record */
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:14px}
.big .wl{font:700 44px/46px var(--cond);letter-spacing:.01em}
.big .un{font:700 30px/34px var(--cond)}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.allbets{font:700 18px/22px var(--cond);margin-top:6px}
.tr.c2{grid-template-columns:minmax(0,1fr) 60px 60px}
.tbl{margin-top:16px;font-size:13px;line-height:18px;border-top:1px solid var(--line2)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 40px 46px 50px;column-gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:11px;line-height:15px;color:var(--muted);padding:6px 0 5px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .span2{grid-column:span 2}
.tr .few{grid-column:1 / -1;text-align:left;font-size:11px;line-height:15px;color:var(--muted);white-space:normal}
.tr .num{font:700 17px/18px var(--cond)}
.tr .lbl small{display:block;font-size:11px;line-height:15px;color:var(--muted)}
.filters{display:inline-flex;margin:18px 0 0;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.fbtn{min-height:44px;display:inline-flex;align-items:center}
.fbtn+.fbtn{border-left:1px solid var(--line2)}
.fbtn span{display:inline-flex;align-items:center;height:44px;padding:0 18px;font-size:13.5px;font-weight:600;color:var(--muted)}
.fbtn[aria-pressed="true"] span{background:var(--raise);color:var(--fg)}
.night{margin-top:20px}
.night h3{font:700 16px/20px var(--cond);letter-spacing:.01em;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.night h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:40px;font:700 16px/20px var(--cond);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:650}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ptag{display:inline-block;font:700 11px/15px var(--cond);letter-spacing:.07em;padding:0 4px;margin-right:6px;border:1px solid var(--bad);border-radius:3px;color:var(--bad);vertical-align:1px}
.legs{padding:0 0 0 12px;border-left:1px solid var(--line2);margin:0 0 4px 20px}
.legs .ent{min-height:0}

/* sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line2);border-bottom:0;border-radius:12px 12px 0 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font:700 19px/24px var(--cond);letter-spacing:.01em;margin:0;flex:1;min-width:0}
.sheet-h .ibtn{margin:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + var(--sab));overscroll-behavior:contain}
.rules{margin:10px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere;color:var(--fg2)}
.rules li::marker{color:var(--muted);font:700 14px var(--cond)}
.slot{font-weight:650;color:var(--fg);white-space:nowrap}
.slot.miss{color:var(--warn)}
/* update status: one row per feed with its state, like a service status page */
.svc-h{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--good);background:var(--good-soft);border-radius:0 6px 6px 0;font-weight:650}
.svc-h.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.svc-h .ic{display:flex;color:var(--good)} .svc-h.bad .ic{color:var(--bad)}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);column-gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:19px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-size:12.5px;display:flex;align-items:baseline;gap:6px}
.kv .k i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--good);transform:translateY(-1px)}
.kv .k i.bad{background:var(--bad)} .kv .k i.na{background:var(--line2)}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv .v.bad{color:var(--bad)}

</div>

<div id="sheetroot"></div>
<noscript><p style="padding:16px 16px 16px 72px">Prop Check NHL needs JavaScript turned on to show tonight's picks.</p></noscript>

}
function fillSheet() {
  var prevScroll = 0, old = sheetRoot.querySelector('.sheet-b'); if (old) prevScroll = old.scrollTop;
  clear(sheetRoot);
  var title = S.sheet === 'rules' ? 'How picks are made' : 'Update status';
  var body = h('div', { class: 'sheet-b' });
  if (S.sheet === 'rules') rulesBody(body); else statusBody(body);
  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'sheet-h' }, h('h2', { text: title }),
      h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close', on: { click: function () { closeSheet(false); } } }, icon('close', 22))), body);
  var scrim = h('div', { class: 'scrim', on: { click: function (e) { if (e.target === scrim) closeSheet(false); } } }, sheet);
  sheetRoot.appendChild(scrim); document.body.style.overflow = 'hidden'; body.scrollTop = prevScroll;
}
function slot(key, kind) {
  var path = key.split('.'), v = ruleVal(path[0]);
  for (var i = 1; i < path.length; i++) v = isObj(v) ? v[path[i]] : undefined;
  var n = num(v), t = null;
  if (kind === 'text') { if (v != null && v !== '') t = str(v); }
  else if (kind === 'list') {
    var xs = arr(v).map(function (x) { return num(x) != null ? String(num(x)) : null; }).filter(function (x) { return x != null; });
    if (xs.length) t = xs.length === 1 ? xs[0] : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  }
  else if (n != null) {
    if (kind === 'price') t = odds(n);
    else if (kind === 'pct') t = (Math.round(n * 1000) / 10) + '%';
    else if (kind === 'pts') t = String(Math.round(n * 1000) / 10);
    else t = String(n);
  }
  return t == null ? h('span', { class: 'slot miss', text: '[missing]' }) : h('span', { class: 'slot', text: t });
}
/* Sentences live here; every number comes from rules.json ("values", with the one rule under gap_guard). "{key|kind}" kinds:
   price, pct, pts (0.02 -> 2), num, text, list (an array: "1.5 and 2.5"); a key may be dotted (gap_guard.lines). There is ONE rule. */
var RULES = [
  'We bet only Hard Rock shots on goal at the {gap_guard.lines|list} lines, over or under, at {gap_guard.price_gate|price} or better. Plus money has no cap.',
  "Step 1, the gap. At the 90 and 45 minute price reads we ask the other books. At least {gap_guard.books_min|num} of them (Pinnacle must be one) must price the same player and line, both sides. We take their margin out and use the middle chance. Hard Rock's price has to beat it by at least {gap_guard.gap_ev|pct}, and Pinnacle on its own must not say the price loses.",
  "Step 2, the guard. We blend {gap_guard.market_weight|pct} the other books' chance with {gap_guard.model_weight|pct} our model's chance. The blend still has to beat the price by at least {gap_guard.final_ev|pct}. The model can only say no: it never creates a pick.",
  'The first 90 or 45 minute read that passes both steps becomes the pick, and its price is frozen. That is the price shown here, in the alerts and graded on the Record. The 1 PM read only sets a baseline.',
  'One pick per player (his best side and line). No per-game or nightly limit: every leg that clears both steps is shown, ranked best blend first, and graded on the Record. Parlays are not offered: there is no evidence for them yet.',
  "A pick is pulled if the player is out of the lineup, Hard Rock moves the price and the gap falls under {gap_guard.pull_ev|pct}, fewer than {gap_guard.books_min|num} other books still quote it, Pinnacle stops quoting it or disagrees, the blend no longer beats the price by {gap_guard.final_ev|pct}, or the line is taken down. Each pulled pick says what it means if you already bet it at the shown price (a Hard Rock bet can't be taken back). The 45 minute read is the last price check: after it a pick shows Price final, and only a scratch can pull it. Pulled picks stay on the Record.",
  "A player needs {min_history|num} games of history. One who missed his team's last game waits for a confirmed lineup, and one back from {absence_games|num} or more missed games sits out {absence_sitout|num} games.",
  "Results come from the NHL boxscore once each game is final. Overtime counts, shootouts don't. Graded at the price shown, {stake|num} unit each.",
  'New picks stop by themselves if the Record falls to {gap_guard.safety_units|num} units, until the team reviews. We need {min_sample|num} graded picks before judging results.'
];
function rulesBody(body) {
  var v = S.rules ? S.rules.version : null, up = S.rules ? S.rules.updated : null;
  var head = h('div', { class: 'mu', style: 'font-size:12px' });
  head.appendChild(node('Rules v')); head.appendChild(v != null ? node(str(v)) : h('span', { class: 'slot miss', text: '[missing]' }));
  head.appendChild(node(' · changed ')); head.appendChild(up ? node(fDateShort(up)) : h('span', { class: 'slot miss', text: '[missing]' }));
  body.appendChild(head);
  if (!S.rules) body.appendChild(h('p', { style: 'color:var(--warn)', text: "The rule numbers didn't load, so they show as [missing] below." }));
  var ol = h('ol', { class: 'rules' });
  RULES.forEach(function (s) {
    var li = h('li'), re = /\{([a-z0-9_.]+)\|([a-z]+)\}/g, last = 0, m;
    while ((m = re.exec(s))) { if (m.index > last) li.appendChild(node(s.slice(last, m.index))); li.appendChild(slot(m[1], m[2])); last = re.lastIndex; }
    if (last < s.length) li.appendChild(node(s.slice(last)));
    ol.appendChild(li);
  });
  body.appendChild(ol);
  body.appendChild(h('p', { class: 'note', text: 'All times Eastern. Picks are estimates, not guarantees.' }));
}
function statusBody(body) {
  var sl = S.slate || {}, st = isObj(sl.status) ? sl.status : {}, exp = expired(), pool = isObj(st.pool) ? st.pool : {};
  /* one row per feed, like a service status page: name + state dot, then the plain sentence; the header sums them up */
  var rows = [], nBad = 0;
  var row = function (k, v, bad, na) { if (bad) nBad++; rows.push(h('div', { class: 'kv' }, h('span', { class: 'k' }, k ? h('i', { class: bad ? 'bad' : (na ? 'na' : null) }) : null, k), h('span', { class: 'v' + (bad ? ' bad' : ''), text: v }))); };
  var pa = fStamp(st.prices_at), pt;
  switch (st.prices_state) {
    case 'ok': pt = pa ? 'Hard Rock prices read at ' + pa : 'Prices not read yet'; break;
    case 'not_yet': pt = 'Prices not read yet today'; break;
    case 'limited': pt = (pa ? 'Hard Rock prices read at ' + pa + '. ' : '') + 'Limited today: fewer games or markets than usual.'; break;
    case 'pool_empty': pt = 'No Hard Rock prices today. The odds pulls ran out.'; break;
    case 'feed_down': pt = 'No Hard Rock prices today. The odds feed did not answer.'; break;
    case 'keys_refused': pt = 'Hard Rock prices are off: the odds keys were refused. New keys are needed.' + (pa ? ' Last read ' + pa + '.' : ''); break;
    default: pt = (pa ? 'Hard Rock prices read at ' + pa : 'Prices not read yet') + (st.prices_state ? ' (' + str(st.prices_state) + ')' : '');
  }
  if (exp) pt = 'Prices not read yet today. Last read ' + (pa || 'not on file') + '.';
  row('Prices', pt, st.prices_state === 'pool_empty' || st.prices_state === 'feed_down' || st.prices_state === 'keys_refused');
  row('Next read', fStamp(st.next_price_read_at) ? 'Next price read ' + fStamp(st.next_price_read_at) : 'No further price read scheduled', false, true);
  var lt = lineupShort(st);
  if (st.lineups_state === 'failed') lt = "Lineups couldn't be checked, so picks stay Early.";
  else if (st.lineups_state === 'partial') lt = 'Lineups partly checked' + (fStamp(st.lineups_at) ? ' at ' + fStamp(st.lineups_at) : '') + '. Picks for teams not checked stay Early.';
  else if (fStamp(st.lineups_at)) lt = 'Lineups checked at ' + fStamp(st.lineups_at);
  row('Lineups', lt, st.lineups_state === 'failed');
  if (st.lineups_note) row('', str(st.lineups_note), false, true);
  if (fStamp(st.goalies_at)) row('Goalies', 'Goalies checked at ' + fStamp(st.goalies_at));
  row('Stats', (st.stats_state === 'behind' ? 'Stats are behind. ' : '') + (st.stats_through ? 'Stats through games of ' + fDateShort(st.stats_through) : 'Stats not built yet') +
    (fStamp(st.stats_built_at) ? ', built ' + fStamp(st.stats_built_at) : ''), st.stats_state === 'behind');
  if (num(st.lines_checked) != null) row('Lines', 'Checked ' + st.lines_checked + ' Hard Rock lines', false, true);
  var pl = [], od = oddsShort(st);
  if (od) pl.push((od.low ? 'Odds running low: ' : 'Odds: ') + od.days + ' at the current pace');
  var nk = Array.isArray(pool.keys) ? pool.keys.length : num(pool.keys);
  if (nk != null) pl.push(nk + (nk === 1 ? ' odds key' : ' odds keys') + ' in use');
  row('Odds keys', pl.length ? pl.join('. ') + '.' : 'Odds left: not reported', pool.low === true);
  row('Page data', fStamp(sl.generated_at) ? 'Last update ' + fStamp(sl.generated_at) : 'Last update time not on file', stale() || exp);
  var lr = isObj(st.last_run) ? st.last_run : null;
  if (lr && lr.ok === false) row('Last run', 'The last update failed' + (fStamp(lr.at) ? ' at ' + fStamp(lr.at) : '') + (lr.failed_step ? ' (' + str(lr.failed_step) + ')' : '') + '.', true);
  var ex = arr(st.excluded_teams).filter(isObj);
  if (ex.length) row('Teams', 'Not covered tonight: ' + ex.map(function (x) { return str(x.team) + (x.reason ? ' (' + str(x.reason) + ')' : ''); }).join(', '));
  if (S.fetchFail) row('Connection', (S.fetchFail === 'file' ? "The picks file couldn't be read. Trying again." : "Can't reach the picks right now.") + ' Showing what loaded at ' + (fTime(S.loadedAt) || 'an earlier time') + '.', true);
  body.appendChild(h('div', { class: 'svc-h' + (nBad ? ' bad' : ''), role: 'status' }, h('span', { class: 'ic' }, icon(nBad ? 'warn' : 'check', 16)),
    nBad ? (nBad === 1 ? '1 thing needs attention' : nBad + ' things need attention') : 'No problems found'));
  rows.forEach(function (r) { body.appendChild(r); });
  body.appendChild(h('p', { class: 'note', text: 'This page checks for updates about every ' + Math.round(uiVal('refresh_sec') / 60) + ' minutes while it is open. All times Eastern.' }));
}

/* ---------- wiring ---------- */
window.addEventListener('popstate', function () { if (S.sheet) closeSheet(true); route(); });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(false); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) writeSeen(); else load().then(schedule);
});
window.addEventListener('pagehide', writeSeen);
setInterval(function () { if (S.loaded && !document.hidden) maybeRender(); }, 30000);

S.view = viewFromHash();
renderTabs();
load().then(schedule);
})();
</script>
</body>
